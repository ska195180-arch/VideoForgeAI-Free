name: Build VideoForge AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q "VideoForgeAI-Free-APK-v6-GitHub-Build.zip" -d project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Build APK
        run: |
          SETTINGS_FILE=$(find project -type f -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoForgeAI-Free-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
